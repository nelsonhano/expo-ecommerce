# Publish update
#
# Publishes an EAS Update to the current branch.
# Learn more: https://docs.expo.dev/eas/workflows/examples/publish-preview-update/
#
# Created by EAS CLI v27.10.0

name: Publish update

on:
  push:
    branches: ["*"]

jobs:
  publish_update:
    name: Publish update
    type: update
    params:
      branch: ${{ github.ref_name || "main" }}
